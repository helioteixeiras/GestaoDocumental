<div class="notification" [class]="'notification--' + data.type" role="status">
  <mat-icon class="notification__icon" aria-hidden="true">{{ icon }}</mat-icon>
  <span class="notification__message">{{ data.message }}</span>
  <button
    mat-icon-button
    type="button"
    class="notification__close"
    aria-label="Fechar notificação"
    (click)="dismiss()"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>
